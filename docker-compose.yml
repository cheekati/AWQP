services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Change_this_password_123!"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Change_this_password_123! -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/AWQP.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      SeedDatabase: "true"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=AWQP;User Id=sa;Password=Change_this_password_123!;TrustServerCertificate=True"
      Jwt__SigningKey: "replace-with-a-strong-256-bit-secret-key-before-production"
    ports:
      - "8080:8080"
    depends_on:
      sqlserver:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: src/AWQP.Web/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ApiBaseUrl: "http://api:8080/"
    ports:
      - "8081:8080"
    depends_on:
      - api

volumes:
  sqlserver-data:
